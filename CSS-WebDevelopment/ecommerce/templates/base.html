<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaMart | Ecommerce Demo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <style>
    body {
      background-color: #f6f7fb;
    }
    .hero {
      background: linear-gradient(120deg, #0d6efd, #6f42c1);
    }
    .hero-text {
      max-width: 480px;
    }
    .product-card img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">NovaMart</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="/">Support</a></li>
          <li class="nav-item">
            <a class="btn btn-outline-light ms-lg-3" href="/">Cart (2)</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="py-4 mt-5 bg-white border-top">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <p class="text-muted mb-2 mb-md-0">© 2024 NovaMart. All rights reserved.</p>
      <div class="d-flex gap-3">
        <a class="text-muted text-decoration-none" href="/">Privacy</a>
        <a class="text-muted text-decoration-none" href="/">Terms</a>
        <a class="text-muted text-decoration-none" href="/">Contact</a>
      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
