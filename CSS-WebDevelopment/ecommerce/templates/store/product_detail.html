{% extends "base.html" %}

{% block content %}
<section class="container py-5">
  <div class="row g-4 align-items-center">
    <div class="col-lg-6">
      <img src="{{ product.image }}" alt="{{ product.name }}" class="img-fluid rounded-4 shadow-sm">
    </div>
    <div class="col-lg-6">
      <span class="badge text-bg-warning mb-2">{{ product.badge }}</span>
      <h1 class="fw-bold">{{ product.name }}</h1>
      <p class="text-muted">{{ product.description }}</p>
      <h3 class="fw-bold">{{ product.price }}</h3>
      <div class="d-flex gap-3 mt-4">
        <button class="btn btn-primary btn-lg">Add to cart</button>
        <a class="btn btn-outline-secondary btn-lg" href="/">Continue shopping</a>
      </div>
      <div class="mt-4">
        <h6 class="fw-bold">What you get</h6>
        <ul class="text-muted">
          <li>Free standard shipping</li>
          <li>2-year warranty</li>
          <li>14-day price guarantee</li>
        </ul>
      </div>
    </div>
  </div>
</section>
{% endblock %}
